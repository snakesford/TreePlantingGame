<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hexagon</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <header class="top-bar">
    <div class="level-row">
      <div class="level-indicator">
        <progress class="level-progress" value="0" max="100" aria-label="Level 1 progress"></progress>
        <span class="level-label" aria-hidden="true">Level 1</span>
      </div>
      <button class="next-level-button" type="button" hidden>Next Level</button>
    </div>
    <div class="level-details">
      <p class="level-objective"></p>
      <p class="level-progress-text"></p>
      <p class="level-notification" role="status" aria-live="polite" hidden></p>
    </div>
    <div class="money-counter" aria-label="Leaves">
      <img class="currency-icon balance-icon" src="images/leaf.png" alt="Leaves" width="32" height="32" />
      <output class="money-amount" aria-live="polite">5</output>
    </div>
    <aside class="daylight-clock" aria-label="Day and night cycle">
      <span class="daylight-label">Daylight</span>
      <span class="daylight-status" aria-live="polite">Day</span>
      <span class="clock-face" role="img"
        aria-label="One-minute day and night cycle with payouts at sunrise and sunset.">
        <span class="clock-dial" aria-hidden="true">
          <span class="clock-tick sunrise-earning"></span>
          <span class="clock-tick sunset-earning"></span>
        </span>
        <span class="clock-markers" aria-hidden="true">
          <span class="clock-marker sun-marker">☾</span>
          <span class="clock-marker moon-marker">☀</span>
        </span>
        <span class="clock-current-time-tick" aria-hidden="true"></span>
      </span>
      <div class="clock-controls" aria-label="Daylight clock controls">
        <button class="clock-control pause-clock" type="button" aria-label="Pause daylight clock"
          aria-pressed="false" title="Pause">⏸</button>
        <button class="clock-control speed-toggle" type="button" aria-label="Triple daylight clock speed"
          aria-pressed="false" title="Triple speed">▶▶</button>
      </div>
    </aside>
  </header>
  <output class="save-status" role="status" aria-live="polite"></output>
  <main aria-label="Green hexagon game board">
    <svg class="hex-board" viewBox="0 0 460 410" role="img" aria-label="Hexagon tile grid">
      <g class="hex-tiles"></g>
    </svg>
  </main>
  <div class="game-actions">
    <button class="plant-maple-button" type="button">
      <img class="seed-button-icon" src="images/maple/seed.png" alt="" width="48" height="48" />
      <span>Plant Maple Seed <img class="currency-icon" src="images/leaf.png" alt="leaves" width="20" height="20" />1</span>
    </button>
    <button class="plant-birch-button" type="button">
      <img class="seed-button-icon" src="images/birch/seed.png" alt="" width="48" height="48" />
      <span>Plant Birch Seed <img class="currency-icon" src="images/leaf.png" alt="leaves" width="20" height="20" />1</span>
    </button>
    <button class="plant-spruce-button" type="button">
      <img class="seed-button-icon" src="images/spruce/seed.png" alt="" width="48" height="48" />
      <span>Plant Spruce Seed <img class="currency-icon" src="images/leaf.png" alt="leaves" width="20" height="20" />1</span>
    </button>
    <button class="plant-oak-button" type="button">
      <img class="seed-button-icon" src="images/oak/seed.png" alt="" width="48" height="48" />
      <span>Plant Oak Seed <img class="currency-icon" src="images/leaf.png" alt="leaves" width="20" height="20" />3</span>
    </button>
    <button class="buy-tile-button" type="button">Buy Tile <img class="currency-icon" src="images/leaf.png" alt="leaves" width="20" height="20" />25</button>
  </div>
  <dialog class="save-slot-dialog" aria-labelledby="save-slot-title">
    <h1 id="save-slot-title">Save Slot 1</h1>
    <p class="save-slot-summary"></p>
    <div class="save-slot-actions">
      <button class="continue-game-button" type="button">Continue</button>
      <button class="new-game-button" type="button">Start New Game</button>
    </div>
  </dialog>
  <dialog class="seed-dialog" aria-labelledby="seed-dialog-title">
    <h2 id="seed-dialog-title">Seed</h2>
    <div class="seed-preview-section">
      <div class="seed-preview">
        <img src="images/seed.png" alt="Seed" />
      </div>
      <p class="sprout-description">Click to upgrade. Free growth every 3 days.</p>
    </div>
    <div class="seed-upgrade-progress">
      <div class="seed-progress-track">
        <progress class="seed-progress-bar" max="4" value="0" aria-label="Upgrades in current growth stage"></progress>
        <output class="seed-progress-count" aria-live="polite">0/4</output>
      </div>
      <span class="seed-upgrade-cost"><img class="currency-icon" src="images/leaf.png" alt="leaves" width="20" height="20" />0.5</span>
    </div>
    <p class="seed-compost-info"></p>
  </dialog>
  <dialog class="obstacle-dialog" aria-labelledby="obstacle-dialog-title">
    <h2 id="obstacle-dialog-title">Obstacle</h2>
    <div class="obstacle-preview-section">
      <div class="obstacle-preview">
        <img alt="" />
      </div>
      <p class="obstacle-description"></p>
    </div>
  </dialog>
  <script type="text/javascript" src="script.js"></script>
</body>

</html>
