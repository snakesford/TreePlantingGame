<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hexagon</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <header class="top-bar">
    <div class="money-counter" aria-label="Money">
      <span class="money-label">Money</span>
      <output class="money-amount" aria-live="polite">0.5</output>
    </div>
    <aside class="daylight-clock" aria-label="Day and night cycle">
      <span class="daylight-label">Daylight</span>
      <span class="daylight-status" aria-live="polite">Day</span>
      <span class="clock-face" role="img"
        aria-label="Two-minute cycle starts at sunrise. Sun is highest at 30 seconds; moon is highest at 90 seconds.">
        <span class="clock-dial" aria-hidden="true">
          <span class="clock-tick day-earning-one"></span>
          <span class="clock-tick day-earning-two"></span>
          <span class="clock-tick day-earning-three"></span>
          <span class="clock-tick day-earning-four"></span>
          <span class="clock-tick night-earning-one"></span>
          <span class="clock-tick night-earning-two"></span>
        </span>
        <span class="clock-markers" aria-hidden="true">
          <span class="clock-marker sun-marker">☾</span>
          <span class="clock-marker moon-marker">☀</span>
        </span>
        <span class="clock-current-time-tick" aria-hidden="true"></span>
      </span>
      <div class="clock-controls" aria-label="Daylight clock controls">
        <button class="clock-control pause-clock" type="button" aria-label="Pause daylight clock"
          aria-pressed="false" title="Pause">⏸</button>
        <button class="clock-control speed-toggle" type="button" aria-label="Triple daylight clock speed"
          aria-pressed="false" title="Triple speed">▶▶</button>
      </div>
    </aside>
  </header>
  <main aria-label="A large green hexagon made from smaller hexagons, with six along each side">
    <svg class="hex-board" viewBox="0 0 460 410" role="img" aria-label="Hexagon tile grid">
      <g class="hex-tiles"></g>
    </svg>
  </main>
  <button class="plant-button" type="button">Plant Seed (0.25)</button>
  <dialog class="seed-dialog" aria-labelledby="seed-dialog-title">
    <h2 id="seed-dialog-title">Seed</h2>
    <div class="seed-preview-section">
      <div class="seed-preview">
        <img src="images/sprout.png" alt="Sprout" />
      </div>
      <p class="sprout-description">Sprouts earn 0.5 per tick</p>
    </div>
    <div class="seed-upgrade-progress">
      <div class="seed-progress-track">
        <progress class="seed-progress-bar" max="4" value="0" aria-label="Seed upgrade progress"></progress>
        <output class="seed-progress-count" aria-live="polite">0/4</output>
      </div>
      <span class="seed-upgrade-cost">0.4</span>
    </div>
  </dialog>
  <script type="text/javascript" src="script.js"></script>
</body>

</html>
